plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base']
}

group 'ART_FANS'
version 'v1'
mainClassName = 'Main'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.openjfx:javafx-controls:21"
    implementation "org.openjfx:javafx-fxml:21"
    implementation "org.openjfx:javafx-base:21"
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
}

test {
    useJUnitPlatform()
}

jar {

    duplicatesStrategy(DuplicatesStrategy.INCLUDE)

    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('build-cs108', Jar) {
    archiveBaseName.set(tasks.jar.archiveBaseName)
    archiveVersion.set(tasks.jar.archiveVersion)
    from sourceSets.main.output

    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
}


tasks.register('cs108Javadoc', Javadoc) {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
}

tasks.named('build-cs108') {
    dependsOn 'cs108Javadoc'
}