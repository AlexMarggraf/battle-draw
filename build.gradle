plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.base', 'javafx.swing']
}

group 'ART_FANS'
version 'v1'
mainClassName = 'Main'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation "org.openjfx:javafx-controls:21"
    implementation "org.openjfx:javafx-fxml:21"
    implementation "org.openjfx:javafx-base:21"
    implementation 'org.openjfx:javafx-graphics:21'
    implementation 'org.openjfx:javafx-swing:21'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
}

test {
    useJUnitPlatform()
}

jar {
    duplicatesStrategy(DuplicatesStrategy.INCLUDE)
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

javadoc {
    destinationDir = file("$buildDir/docs/javadoc")
}

tasks.register('copyDatabase', Copy) {
    from 'database/Thema.db'
    into "$buildDir/libs/database"
}

tasks.register('build-cs108') {
    group = 'build'
    dependsOn 'jar', 'javadoc', 'copyDatabase'
}
